apiVersion: apps/v1
kind: Deployment
metadata:
  name: vasati-web
  namespace: vasati-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vasati-web
  template:
    metadata:
      labels:
        app: vasati-web
    spec:
      containers:
        - name: web
          image: vasati-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vasati-web
  namespace: vasati-web
spec:
  selector:
    app: vasati-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vasati-web
  namespace: vasati-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vasati.konstantiniyye.studio
      secretName: vasati-web-tls
  rules:
    - host: vasati.konstantiniyye.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vasati-web
                port:
                  number: 80
