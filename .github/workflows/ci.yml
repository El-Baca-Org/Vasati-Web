name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Run tests
        run: npm test -- --passWithNoTests
      - name: Build container
        run: docker build --tag vasati-web:latest .

  deploy:
    name: Deploy to Rancher
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build --tag vasati-web:latest .
      - name: Import image into K3s
        run: |
          docker save vasati-web:latest > /tmp/vasati-web.tar
          docker run --rm -i --privileged -v /:/host alpine:3.22 sh -c "cat > /host/tmp/vasati-web.tar && chroot /host /usr/local/bin/k3s ctr -n k8s.io images import /tmp/vasati-web.tar && rm -f /host/tmp/vasati-web.tar"
      - name: Deploy
        run: kubectl apply -f k8s/vasati-web.yaml
      - name: Rollout
        run: kubectl -n vasati-web rollout status deployment/vasati-web --timeout=180s
      - name: Smoke test
        run: curl --fail --silent --show-error https://vasati.konstantiniyye.studio/ >/dev/null
